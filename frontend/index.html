<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Phân Loại Bệnh Lá Khoai Tây</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="frontend/style.css">
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <div class="header-logo">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M10 2C10 2 5 5.8 5 11.2C5 14.5 7.2 17 10.3 17C13.4 17 16 14.5 16 11.2C16 5.8 10 2 10 2Z" fill="#4a8522" opacity="0.9"/>
      <path d="M10 17V7M10 7C10 7 8 10 7 12M10 7C10 7 12 10 13 12" stroke="#2e5a12" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </div>
  <div>
    <h1>Bệnh Lá Khoai Tây</h1>
    <p>Phân tích bệnh bằng AI · Deep Learning</p>
  </div>
</div>

<!-- ══ PAGE: PHÂN TÍCH ══ -->
<div class="page active" id="page-analyze">

  <!-- Input Switcher -->
  <div class="input-switcher">
    <button class="switcher-btn active" id="sw-upload" onclick="switchInput('upload')">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 10V4M7.5 4L5.5 6M7.5 4L9.5 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11v1a1 1 0 001 1h8a1 1 0 001-1v-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Tải ảnh lên
    </button>
    <button class="switcher-btn" id="sw-camera" onclick="switchInput('camera')">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="1" y="4" width="13" height="9" rx="2" stroke="currentColor" stroke-width="1.4"/><circle cx="7.5" cy="8.5" r="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 4L6.5 2h2l1 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Chụp ảnh
    </button>
  </div>

  <!-- Upload Panel -->
  <div id="upload-panel">
    <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div id="upload-placeholder">
        <div class="upload-icon">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <path d="M11 15V7M11 7L8.5 9.5M11 7L13.5 9.5" stroke="var(--green-dark)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 16v1a1.5 1.5 0 001.5 1.5h11A1.5 1.5 0 0018 17v-1" stroke="var(--green-dark)" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="upload-label">Kéo thả hoặc chọn ảnh</div>
        <div class="upload-sub">JPG, JPEG, PNG</div>
      </div>
      <img id="preview-img" alt="preview"/>
      <div id="preview-name"></div>
    </div>
    <input type="file" id="file-input" accept=".jpg,.jpeg,.png">
  </div>

  <!-- Camera Panel -->
  <div class="camera-panel" id="camera-panel">
    <div id="camera-live" style="display:none;">
      <video id="camera-video" autoplay playsinline muted></video>
      <div class="camera-controls">
        <button class="btn-cam-capture" onclick="capturePhoto()">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="6" stroke="white" stroke-width="1.5"/><circle cx="9" cy="9" r="2.5" fill="white"/></svg>
          Chụp ảnh
        </button>
        <button class="btn-cam-switch" onclick="flipCamera()" id="btn-flip" title="Đổi camera">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8a6 6 0 0010.5-3.9M14 8a6 6 0 01-10.5 3.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M13 3.5L14 8l-4.5-.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12.5L2 8l4.5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <canvas id="camera-canvas"></canvas>
    <div id="captured-preview" class="captured-preview" style="display:none;">
      <img id="captured-img" alt="captured"/>
      <button class="captured-retake" onclick="retakePhoto()">↩ Chụp lại</button>
    </div>
    <div id="camera-start-btn" style="text-align:center;padding:2rem 0;">
      <button class="btn-analyze" style="max-width:260px;" onclick="startCamera()">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><rect x="1.5" y="4" width="14" height="10" rx="2" stroke="white" stroke-width="1.4"/><circle cx="8.5" cy="9" r="2.5" stroke="white" stroke-width="1.4"/><path d="M5.5 4L6.5 2.5h4L11.5 4" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Mở camera
      </button>
      <p style="font-size:12px;color:var(--text-2);margin-top:0.75rem;">Cho phép truy cập camera khi trình duyệt hỏi</p>
    </div>
  </div>

  <!-- Analyze Button -->
  <button class="btn-analyze" id="btn-analyze" disabled onclick="runAnalysis()">
    <div class="spinner" id="spinner"></div>
    <svg id="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="5.5" stroke="white" stroke-width="1.4"/>
      <path d="M8 5v3l2 1.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <span id="btn-text">Phân tích bệnh</span>
  </button>

  <div class="error-box" id="error-box"></div>

  <!-- Result -->
  <div class="card result-card" id="result-card">
    <div class="result-header">
      <div class="result-dot" id="result-dot"></div>
      <div class="result-meta">
        <div class="result-sup">Kết quả phân tích</div>
        <div class="result-label" id="result-label">—</div>
      </div>
    </div>
    <div class="result-body">
      <div class="conf-row">
        <span class="conf-label">Độ tin cậy:   <span class="conf-val" id="conf-val">—</span></span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>
      <div class="all-probs" id="all-probs"></div>
      <div class="result-desc" id="result-desc"></div>
    </div>
  </div>

  <!-- Treatment -->
  <div class="treatment-panel" id="treatment-panel" style="display:none;">
    <div class="treatment-header" onclick="toggleTreatment()">
      <div class="treatment-header-left">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 1.5v12M1.5 7.5h12" stroke="#2e5a12" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="treatment-title">Hướng dẫn xử lý bệnh</span>
        <span class="severity-badge" id="sev-badge"></span>
      </div>
      <svg class="chevron" id="chevron" width="15" height="15" viewBox="0 0 15 15" fill="none">
        <path d="M3.5 5.5l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="treatment-body" id="treatment-body"></div>
  </div>

  <!-- Multi Compare (collapsed) -->
  <div style="margin-top:1.5rem;">
    <div class="section-label">So sánh nhiều ảnh</div>
    <div class="multi-upload-zone" onclick="document.getElementById('multi-input').click()">
  <svg width="22" height="24" viewBox="0 0 22 24" fill="none" style="margin:0 auto 0.6rem;display:block;">
    <rect x="2" y="4" width="8" height="8" rx="2" stroke="var(--green-dark)" stroke-width="1.4"/>
    <rect x="12" y="4" width="8" height="8" rx="2" stroke="var(--green-dark)" stroke-width="1.4"/>
    <rect x="2" y="14" width="8" height="8" rx="2" stroke="var(--green-dark)" stroke-width="1.4"/>
    <rect x="12" y="14" width="8" height="8" rx="2" stroke="var(--green-dark)" stroke-width="1.4"/>
  </svg>
      <div class="upload-label">Chọn 2–8 ảnh để so sánh đồng thời</div>
    </div>
    <input type="file" id="multi-input" accept=".jpg,.jpeg,.png" multiple>
    <div class="multi-preview-grid" id="multi-preview-grid"></div>
    <button class="btn-analyze" id="btn-compare" style="display:none;" onclick="runCompare()">
      <div class="spinner" id="compare-spinner"></div>
      <svg id="compare-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="5.5" stroke="white" stroke-width="1.4"/>
        <path d="M8 5v3l2 1.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span id="compare-text">So sánh</span>
    </button>
    <div class="error-box" id="compare-error"></div>
    <div class="compare-grid" id="compare-grid"></div>
  </div>
</div>

<!-- ── Bottom Nav ── -->
<div class="bottom-nav">
  <a class="nav-btn active" id="nav-analyze" href="#">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
    Phân tích
  </a>
  <a class="nav-btn" id="nav-library" href="page-library.html">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="3" width="6" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="13" width="14" height="4" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
    Thư viện
  </a>
  <a class="nav-btn" id="nav-chat" href="page-chat.html">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5a2 2 0 012-2h10a2 2 0 012 2v7a2 2 0 01-2 2H8l-4 3V5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    Hỏi AI
  </a>
</div>
<script src="frontend/script.js"></script>
</body>
</html>
